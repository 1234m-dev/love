<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Message</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 600px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 20px;
      color: #ffd1dc;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Accessing hidden message...</h1>
    <p>Only one special person should open this. ❤️</p>
    <button onclick="showMessage()">Decrypt message</button>
    <div id="message">
      MY Basira,<br><br>
      I didn’t want to just send a normal text.You make my life brighter, calmer, and happier.<br>
      I wanted to make something for you.<br><br>
      Out of all the tabs open in my life, you’re my favorite one. ❤️<br><br>
      — From Mahdi
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script>
</body>
</html>
